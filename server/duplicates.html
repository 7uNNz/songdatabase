<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>曲庫重複歌曲檢查</title>
<style>
:root{font:16px/1.65 system-ui,"Noto Sans TC",sans-serif;color:#e8edf5;background:#20262f}*{box-sizing:border-box}body{margin:0;padding:28px 18px}main{max-width:820px;margin:auto;background:#2b323c;border:1px solid #4b5666;border-radius:16px;padding:26px}a{color:#d4dfef}h1{font-size:25px;margin:18px 0 8px}p{color:#bdc7d4}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #8595ab;border-radius:8px;background:#5c6878;color:#fff;padding:11px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.danger{background:#78424d;border-color:#a86e78}#status{min-height:28px;white-space:pre-wrap}.group{border:1px solid #566273;border-radius:11px;margin:14px 0;overflow:hidden}.group h2{font-size:18px;margin:0;padding:12px 15px;background:#353e49}.song{display:flex;gap:12px;align-items:flex-start;padding:12px 15px;border-top:1px solid #4b5666}.song input{margin-top:6px;accent-color:#bd727e}.song label{flex:1;cursor:pointer}.song small{display:block;color:#b8c3d1}.count{font-size:13px;color:#b8c3d1}.empty{padding:30px 8px;color:#c9d7ce}.hint{font-size:13px;color:#adb8c7}@media(max-width:520px){main{padding:19px}h1{font-size:21px}}
</style>
<main><a href="/">← 回曲庫</a><h1>曲庫重複歌曲檢查</h1><p>掃描曲庫中已存在的歌曲，依正規化後的歌名分組。掃描不會修改資料；請勾選要刪除的歌曲，確認後才會刪除。</p>
<div class="toolbar"><button id="scan">重新掃描</button><button class="danger" id="delete" disabled>刪除勾選歌曲</button></div><p id="status" role="status">正在掃描曲庫…</p><div id="results"></div>
</main><script>
const results=document.querySelector('#results'),status=document.querySelector('#status'),scanButton=document.querySelector('#scan'),deleteButton=document.querySelector('#delete');let groups=[];
function updateDelete(){deleteButton.disabled=!results.querySelector('input:checked')||scanButton.disabled}
async function scan(){scanButton.disabled=true;deleteButton.disabled=true;status.textContent='正在掃描曲庫…';results.replaceChildren();try{const response=await fetch('/api/catalog/duplicates',{cache:'no-store'}),data=await response.json();if(!response.ok)throw Error(data.error||'掃描失敗');groups=data.groups||[];if(!groups.length){status.textContent='掃描完成，沒有找到重複歌名。';results.innerHTML='<div class="empty">目前曲庫中的歌名都沒有重複。</div>';return}status.textContent=`掃描完成：找到 ${groups.length} 組重複歌名，共 ${groups.reduce((n,g)=>n+g.songs.length,0)} 首歌曲。請勾選你確定要刪除的項目。`;for(const [groupIndex,group] of groups.entries()){const section=document.createElement('section');section.className='group';const heading=document.createElement('h2');heading.textContent=group.title;const count=document.createElement('div');count.className='count';count.textContent=`${group.songs.length} 筆同名`;heading.append(document.createTextNode('　'),count);section.append(heading);for(const [songIndex,song] of group.songs.entries()){const row=document.createElement('div');row.className='song';const input=document.createElement('input');input.type='checkbox';input.id=`song-${groupIndex}-${songIndex}`;input.value=song.id;input.addEventListener('change',updateDelete);const label=document.createElement('label');label.htmlFor=input.id;label.textContent=song.artist||'未填歌手';const detail=document.createElement('small');detail.textContent='勾選後才會列入刪除';label.append(detail);row.append(input,label);section.append(row)}results.append(section)}}catch(error){status.textContent=error.message}finally{scanButton.disabled=false;updateDelete()}}
scanButton.addEventListener('click',scan);deleteButton.addEventListener('click',async()=>{const selected=[...results.querySelectorAll('input:checked')],ids=selected.map(input=>input.value);if(!ids.length)return;const names=selected.map(input=>input.closest('.group').querySelector('h2').firstChild.textContent.trim()).slice(0,8);const more=ids.length>8?`\n以及另外 ${ids.length-8} 首`:'';if(!confirm(`確定從曲庫刪除勾選的 ${ids.length} 首歌曲？\n${names.join('、')}${more}\n此操作無法復原。`))return;deleteButton.disabled=true;scanButton.disabled=true;status.textContent='正在刪除…';try{const response=await fetch('/api/catalog/duplicates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})}),data=await response.json();if(!response.ok)throw Error(data.error||'刪除失敗');status.textContent=`已刪除 ${data.deleted} 首，正在重新掃描…`;await scan()}catch(error){status.textContent=error.message;scanButton.disabled=false;updateDelete()}});scan();
</script>
