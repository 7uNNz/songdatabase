<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>曲庫備份與還原</title>
<style>body{font:16px/1.7 system-ui;background:#f5f6fa;color:#283249;margin:0;padding:30px 20px}main{max-width:620px;margin:auto;background:white;border:1px solid #e3e6ee;border-radius:16px;padding:28px}h1{font-size:24px}button,a{color:#425bb1}button{border:0;border-radius:9px;background:#425bb1;color:white;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}section{border-top:1px solid #e3e6ee;padding:20px 0}input{max-width:100%;margin:12px 0}#status,#compare-result{white-space:pre-wrap}dialog{max-width:480px;border:0;border-radius:14px;padding:24px;color:#283249;box-shadow:0 16px 60px #17213a44}dialog::backdrop{background:#17213a77}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.actions button:last-child{background:#e9ecf4;color:#283249}</style>
<main><a href="/">← 回曲庫</a><h1>曲庫備份與還原</h1>
<section><h2>下載備份</h2><p>包含歌名、歌手、歌詞、YouTube 網址與備註。請另存到你的電腦。</p><button id="download">下載 JSON 備份</button></section>
<section><h2>匯入備份</h2><p>新增缺少的歌曲，並補上空白的歌詞、網址與備註。已填寫的資料會保留；只有能與備份精確比對的編碼亂碼會修正。不會刪除曲庫歌曲。</p><input type="file" id="file" accept="application/json,.json"><p id="preview"></p><button id="restore" disabled>匯入這份備份</button></section>
<section><h2>比對歌名</h2><p>將待匯入備份和現有曲庫比對。同名歌曲會列出來，確認後可從本次待匯入清單移除；不會刪除曲庫歌曲。</p><button id="compare" disabled>比對歌名</button><p id="compare-result" role="status"></p></section><p id="status" role="status"></p></main>
<dialog id="duplicate-dialog"><h2>找到同名歌曲</h2><p id="duplicate-summary"></p><p>要從本次待匯入清單移除這些歌嗎？現有曲庫不會變動。</p><div class="actions"><button id="remove-matches">移除重複歌曲</button><button id="keep-matches">保留歌曲</button><button id="cancel">取消</button></div></dialog>
<script>
const status=document.querySelector('#status'),file=document.querySelector('#file'),restore=document.querySelector('#restore'),compare=document.querySelector('#compare'),dialog=document.querySelector('#duplicate-dialog');let rows,matchedRows=[];
document.querySelector('#download').onclick=async()=>{try{status.textContent='正在下載…';const res=await fetch('/api/backup');if(!res.ok)throw Error('下載失敗，請確認已登入歌曲管理。');const blob=await res.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pk-library-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='備份已下載。';}catch(e){status.textContent=e.message}};
file.onchange=async()=>{rows=null;matchedRows=[];restore.disabled=true;compare.disabled=true;document.querySelector('#preview').textContent='';document.querySelector('#compare-result').textContent='';status.textContent='';try{const f=file.files[0];if(!f)return;if(f.size>10485760)throw Error('檔案超過 10 MB。');rows=JSON.parse((await f.text()).replace(/^\uFEFF/,''));if(!Array.isArray(rows)||!rows.length)throw Error('請選擇有歌曲資料的 JSON 備份。');document.querySelector('#preview').textContent=`這份備份有 ${rows.length} 首歌，${rows.filter(x=>typeof x.lyrics==='string'&&x.lyrics.trim()).length} 首有歌詞。`;restore.disabled=false;compare.disabled=false;}catch(e){rows=null;status.textContent=e.message}};
compare.onclick=async()=>{if(!rows)return;compare.disabled=true;try{document.querySelector('#compare-result').textContent='正在比對歌名…';const res=await fetch('/api/backup/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rows)}),data=await res.json();if(!res.ok)throw Error(data.error||'比對失敗');matchedRows=data.matches||[];if(!matchedRows.length){document.querySelector('#compare-result').textContent='沒有和現有曲庫同名的歌曲。';return}const titles=[...new Set(matchedRows.map(x=>x.title))];document.querySelector('#duplicate-summary').textContent=`待匯入清單有 ${matchedRows.length} 首歌和曲庫同名：${titles.slice(0,12).join('、')}${titles.length>12?'…':''}`;dialog.showModal();}catch(e){document.querySelector('#compare-result').textContent=e.message}finally{compare.disabled=!rows}};
document.querySelector('#remove-matches').onclick=()=>{const indexes=new Set(matchedRows.map(x=>x.index));const removed=indexes.size;rows=rows.filter((_,index)=>!indexes.has(index));matchedRows=[];dialog.close();document.querySelector('#preview').textContent=`目前待匯入清單有 ${rows.length} 首歌。`;document.querySelector('#compare-result').textContent=`已從本次待匯入清單移除 ${removed} 首同名歌曲；現有曲庫沒有變動。`;restore.disabled=!rows.length};
document.querySelector('#keep-matches').onclick=()=>{dialog.close();document.querySelector('#compare-result').textContent='已保留同名歌曲；按「匯入這份備份」即可繼續。'};
restore.onclick=async()=>{if(!rows?.length)return;restore.disabled=true;try{status.textContent='正在匯入…';const res=await fetch('/api/backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rows)}),data=await res.json();if(!res.ok)throw Error(data.error||'匯入失敗');status.textContent=`已處理 ${data.processed} 首：新增 ${data.added} 首，原本已在曲庫 ${data.alreadyPresent||0} 首。`;}catch(e){status.textContent=e.message}finally{restore.disabled=!rows?.length}};
document.querySelector('#cancel').onclick=()=>dialog.close();
</script></html>
