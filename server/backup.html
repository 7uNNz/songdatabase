<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>曲庫備份與還原</title>
<style>body{font:16px/1.7 system-ui;background:#f5f6fa;color:#283249;margin:0;padding:30px 20px}main{max-width:620px;margin:auto;background:white;border:1px solid #e3e6ee;border-radius:16px;padding:28px}h1{font-size:24px}button,a{color:#425bb1}button{border:0;border-radius:9px;background:#425bb1;color:white;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}section{border-top:1px solid #e3e6ee;padding:20px 0}input{max-width:100%;margin:12px 0}#status,#compare-result{white-space:pre-wrap}dialog{width:min(700px,calc(100% - 32px));max-height:85vh;overflow:auto;border:0;border-radius:14px;padding:24px;color:#283249;box-shadow:0 16px 60px #17213a44}dialog::backdrop{background:#17213a77}.match-row{border-top:1px solid #e3e6ee;padding:12px 0;display:grid;grid-template-columns:1fr;gap:6px}.match-row strong{font-size:17px}.match-row small{color:#68748b}.match-row select{padding:9px;border:1px solid #cdd3df;border-radius:8px;font:inherit}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.actions button:last-child{background:#e9ecf4;color:#283249}</style>
<main><a href="/">← 回曲庫</a><h1>曲庫備份與還原</h1>
<section><h2>下載備份</h2><p>包含歌名、歌手、歌詞、YouTube 網址與備註。請另存到你的電腦。</p><button id="download">下載 JSON 備份</button></section>
<section><h2>匯入備份</h2><p>新增缺少的歌曲，並補上空白的歌詞、網址與備註。已填寫的資料會保留；只有能與備份精確比對的編碼亂碼會修正。不會刪除曲庫歌曲。</p><input type="file" id="file" accept="application/json,.json"><p id="preview"></p><button id="restore" disabled>匯入這份備份</button></section>
<section><h2>比對歌名</h2><p>將待匯入備份和現有曲庫比對。同名歌曲會列出來，確認後可從本次待匯入清單移除；不會刪除曲庫歌曲。</p><button id="compare" disabled>比對歌名</button><p id="compare-result" role="status"></p></section><p id="status" role="status"></p></main>
<dialog id="duplicate-dialog"><h2>同名歌曲比對</h2><p>預設視為同一首歌，會把備份歌手加到曲庫既有歌曲的歌手欄。若確認是不同歌曲，可改選分開新增；也可略過不匯入。</p><div id="match-list"></div><div class="actions"><button id="apply-review">確認比對</button><button id="cancel">取消</button></div></dialog>
<script>
const status=document.querySelector('#status'),file=document.querySelector('#file'),restore=document.querySelector('#restore'),compare=document.querySelector('#compare'),dialog=document.querySelector('#duplicate-dialog');let rows,matchedRows=[],review=null,hasCompared=false;
document.querySelector('#download').onclick=async()=>{try{status.textContent='正在下載…';const res=await fetch('/api/backup');if(!res.ok)throw Error('下載失敗，請確認已登入歌曲管理。');const blob=await res.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pk-library-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='備份已下載。';}catch(e){status.textContent=e.message}};
file.onchange=async()=>{rows=null;matchedRows=[];review=null;hasCompared=false;restore.disabled=true;compare.disabled=true;document.querySelector('#preview').textContent='';document.querySelector('#compare-result').textContent='';status.textContent='';try{const f=file.files[0];if(!f)return;if(f.size>10485760)throw Error('檔案超過 10 MB。');rows=JSON.parse((await f.text()).replace(/^\uFEFF/,''));if(!Array.isArray(rows)||!rows.length)throw Error('請選擇有歌曲資料的 JSON 備份。');document.querySelector('#preview').textContent=`這份備份有 ${rows.length} 首歌，${rows.filter(x=>typeof x.lyrics==='string'&&x.lyrics.trim()).length} 首有歌詞。`;restore.disabled=false;compare.disabled=false;}catch(e){rows=null;status.textContent=e.message}};
async function compareTitles(){if(!rows)return false;compare.disabled=true;try{document.querySelector('#compare-result').textContent='正在比對歌名…';const res=await fetch('/api/backup/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rows)}),data=await res.json();if(!res.ok)throw Error(data.error||'比對失敗');matchedRows=data.matches||[];hasCompared=true;if(!matchedRows.length){review={artistMerges:[],distinctIndexes:[],skipIndexes:[]};document.querySelector('#compare-result').textContent='沒有同名歌曲。按「匯入這份備份」即可新增歌曲。';return true;}const list=document.querySelector('#match-list');list.replaceChildren();for(const match of matchedRows){const row=document.createElement('div');row.className='match-row';row.dataset.index=String(match.index);const title=document.createElement('strong');title.textContent=match.title;const info=document.createElement('small');info.textContent=`備份歌手：${match.incomingArtist||'未填'}　｜　曲庫歌手：${match.existing.map(x=>x.artist).join('、')}`;const action=document.createElement('select');action.className='match-action';for(const [value,label] of [['merge','同一首：把歌手加進既有歌曲'],['distinct','不同首歌：分開新增'],['skip','略過，不匯入']]){const option=document.createElement('option');option.value=value;option.textContent=label;action.append(option);}row.append(title,info,action);if(match.existing.length>1){const target=document.createElement('select');target.className='match-target';for(const song of match.existing){const option=document.createElement('option');option.value=song.id;option.textContent=`合併至：${song.artist}`;target.append(option);}row.append(target);}else{row.dataset.target=match.existing[0].id;}list.append(row);}document.querySelector('#compare-result').textContent=`找到 ${matchedRows.length} 筆同名歌曲，請逐筆確認處理方式。`;dialog.showModal();return true;}catch(e){document.querySelector('#compare-result').textContent=e.message;return false}finally{compare.disabled=!rows}};
compare.onclick=()=>compareTitles();
document.querySelector('#apply-review').onclick=()=>{const artistMerges=[],distinctIndexes=[],skipIndexes=[];for(const row of document.querySelectorAll('.match-row')){const index=Number(row.dataset.index),action=row.querySelector('.match-action').value;if(action==='merge')artistMerges.push({index,targetId:row.querySelector('.match-target')?.value||row.dataset.target});else if(action==='distinct')distinctIndexes.push(index);else skipIndexes.push(index);}review={artistMerges,distinctIndexes,skipIndexes};dialog.close();const distinctCount=distinctIndexes.length,skipCount=skipIndexes.length;document.querySelector('#compare-result').textContent=`比對選擇已記錄：合併歌手 ${artistMerges.length} 筆、分開新增 ${distinctCount} 筆、略過 ${skipCount} 筆。按「匯入這份備份」套用。`;};
async function importRows(){if(!rows?.length)return;restore.disabled=true;try{status.textContent='正在匯入…';const payload=review?{rows,...review}:rows;const res=await fetch('/api/backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),data=await res.json();if(!res.ok)throw Error(data.error||'匯入失敗');status.textContent=`已處理 ${data.processed} 首：新增 ${data.added} 首、合併歌手 ${data.merged} 首、原本已在曲庫 ${data.alreadyPresent||0} 首、略過 ${data.skipped||0} 首。`;}catch(e){status.textContent=e.message}finally{restore.disabled=!rows?.length}};
restore.onclick=async()=>{if(!rows?.length)return;if(!hasCompared){const okay=await compareTitles();if(!okay||matchedRows.length)return;}if(hasCompared&&!review&&matchedRows.length)return;await importRows()};
document.querySelector('#cancel').onclick=()=>{dialog.close();review=null;hasCompared=false;matchedRows=[];};
</script></html>
